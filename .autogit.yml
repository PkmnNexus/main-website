#######################################################################################
# Autogit - config and deploy hooks
#######################################################################################
# Laravel deployment configuration for TransIP AutoGit
#######################################################################################

# Shared files are preserved between deployments.
# These files are not stored in Git.

shared_files:
  - .env


#######################################################################################
# Laravel webroot
#######################################################################################

shared_folders:
  - storage/app/public


hooks:

  #####################################################################################
  # SETUP
  #####################################################################################

  setup_before: |
    # Nothing required before setup
    exit 0


  setup_after: |
    # Create Laravel public webroot symlink
    # $3 = current release folder

    ln -sfn "$3/public" "$3/www"

    exit 0


  #####################################################################################
  # INSTALL
  #####################################################################################

  install_before: |
    # Nothing required before install
    exit 0


  install_after: |
    echo "Installing Composer dependencies..."

    composer install \
      --no-dev \
      --optimize-autoloader

    echo "Installing frontend dependencies..."

    npm ci

    echo "Building frontend assets..."

    npm run build

    echo "Running database migrations..."

    php artisan migrate --force

    exit 0


  #####################################################################################
  # SHAREDSYMLINK
  #####################################################################################

  sharedsymlink_before: |
    echo "Preparing shared public storage..."

    if [ -d "$3/storage/app/public" ] && [ ! -L "$3/storage/app/public" ]; then
      rm -f "$3/storage/app/public/.gitignore"
      rm -f "$3/storage/app/public/.gitkeep"
    fi

    exit 0


  sharedsymlink_after: |
    echo "Creating public storage symlink..."

    # Link public/storage to shared storage.
    ln -sfn "$3/storage/app/public" "$3/public/storage"

    exit 0


  #####################################################################################
  # SYMLINK
  #####################################################################################

  symlink_before: |
    exit 0


  symlink_after: |
    echo "Optimizing Laravel..."

    php artisan optimize

    exit 0


  #####################################################################################
  # CLEANUP
  #####################################################################################

  cleanup_before: |
    exit 0


  cleanup_after: |
    exit 0