#######################################################################################
# Autogit - config and deploy hooks                                                   #
#######################################################################################
# Laravel deployment configuration for TransIP AutoGit                                #
#######################################################################################

# Shared files are preserved between deployments.
# These files are not stored in Git.
#
# The .env file contains:
# - database credentials
# - APP_KEY
# - production settings
#
# Never commit .env to Git.

shared_files:
  - .env


#######################################################################################
# Laravel webroot                                                                      #
#######################################################################################
#
# Laravel uses /public as the document root.
# TransIP AutoGit expects a /www folder.
#
# We create:
#
# www -> public
#
# This keeps the Laravel structure intact.

hooks:


#######################################################################################
# SETUP                                                                                 #
# Create folder structure for newest release                                            #
#######################################################################################

  setup_before: |
    # Nothing required before setup
    exit 0


  setup_after: |
    # Create Laravel public webroot symlink
    #
    # $3 = current release folder
    #
    ln -sfn "$3/public" "$3/www"

    exit 0



#######################################################################################
# INSTALL                                                                               #
# Install application code and dependencies                                             #
#######################################################################################

  install_before: |
    # Nothing required before install
    exit 0


  install_after: |
    echo "Installing Composer dependencies..."

    composer install \
      --no-dev \
      --optimize-autoloader


    echo "Installing frontend dependencies..."

    npm ci


    echo "Building frontend assets..."

    npm run build


    echo "Running database migrations..."

    # IMPORTANT:
    # migrate only runs NEW migrations.
    #
    # It does NOT:
    # - delete tables
    # - remove data
    # - reset database
    #
    # Never use migrate:fresh in production.

    php artisan migrate --force


    echo "Creating storage link..."

    php artisan storage:link || true


    exit 0



#######################################################################################
# SHAREDSYMLINK                                                                         #
# Link shared files/folders into every release                                          #
#######################################################################################

  sharedsymlink_before: |
    exit 0


  sharedsymlink_after: |
    # .env is automatically linked by AutoGit.
    #
    # Example shared folders:
    #
    # storage
    # logs
    #
    exit 0



#######################################################################################
# SYMLINK                                                                               #
# Switch current release to newest release                                              #
#######################################################################################

  symlink_before: |
    exit 0


  symlink_after: |
    echo "Optimizing Laravel..."


    # Rebuild Laravel caches:
    #
    # - config cache
    # - route cache
    # - view cache
    # - events cache

    php artisan optimize


    exit 0



#######################################################################################
# CLEANUP                                                                               #
# Remove old releases                                                                   #
# AutoGit keeps the newest releases                                                     #
#######################################################################################

  cleanup_before: |
    exit 0


  cleanup_after: |
    exit 0