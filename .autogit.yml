#######################################################################################
# Autogit - config and deploy hooks                                                   #
#######################################################################################

# Laravel production secrets should not be stored in Git.
# This file is stored outside the releases and linked into every deployment.

shared_files:
  - .env


#######################################################################################
# Hooks                                                                            #
#######################################################################################

hooks:


# SETUP: Create folder structure for newest release
  setup_before: |
    exit 0


  setup_after: |
    # Laravel requires the public folder as webroot.
    # TransIP AutoGit expects a www folder.
    #
    # Create:
    # release/www -> release/public

    ln -sfn "$3/public" "$3/www"

    exit 0



# INSTALL: Install application dependencies
  install_before: |
    exit 0


  install_after: |

    echo "Installing Composer dependencies..."

    composer install \
      --no-dev \
      --prefer-dist \
      --optimize-autoloader


    echo "Installing NPM dependencies..."

    npm ci


    echo "Building frontend assets..."

    npm run build


    echo "Running database migrations..."

    # Updates database structure.
    # Existing data stays untouched.
    #
    # NEVER use migrate:fresh here.

    php artisan migrate --force


    exit 0



# SHAREDSYMLINK:
# Shared files are linked here.
#
# .env will be linked automatically from:
#
# ~/shared/.env
#
# into:
#
# release/.env

  sharedsymlink_before: |
    exit 0


  sharedsymlink_after: |

    echo "Shared files linked"

    exit 0



# SYMLINK:
# Switch current release

  symlink_before: |
    exit 0


  symlink_after: |

    echo "Optimizing Laravel..."

    php artisan optimize

    exit 0



# CLEANUP:
# Keep recent releases

  cleanup_before: |
    exit 0


  cleanup_after: |
    exit 0