#######################################################################################
# Autogit - config and deploy hooks                                                   #
#######################################################################################
# Laravel deployment configuration for TransIP AutoGit                                #
#######################################################################################

# Shared files are preserved between deployments.
# These files are not stored in Git and are linked into every release.
#
# The Laravel .env file contains production secrets and database credentials.
# It should never be committed to Git.

shared_files:
  - .env


# Laravel uses the public folder as webroot.
# TransIP AutoGit expects a www folder.
#
# During deployment:
#
# www -> public
#
# This keeps the Laravel structure intact while allowing TransIP
# to serve the correct public directory.

hooks:


# SETUP: Create folder structure for newest release
  setup_before: |
    # Nothing required before setup
    exit 0


  setup_after: |
    # Create Laravel public webroot symlink
    #
    # $3 = current release folder
    #
    ln -sfn "$3/public" "$3/www"

    exit 0



# INSTALL: Put code in release folder
  install_before: |
    # Nothing required before install
    exit 0


  install_after: |
    # Install PHP dependencies
    composer install --no-dev --optimize-autoloader


    # Install frontend dependencies from package-lock.json
    npm ci


    # Build production frontend assets
    npm run build


    # Run database migrations
    #
    # IMPORTANT:
    # migrate updates the database structure only.
    # It does NOT remove existing data.
    #
    # Never use migrate:fresh in production.
    #
    php artisan migrate --force


    exit 0



# SHAREDSYMLINK:
# Create symlink to shared files and folders
# present at every release.
#
# Example:
# - .env
# - storage
#
  sharedsymlink_before: |
    exit 0


  sharedsymlink_after: |
    # .env will automatically be linked here by AutoGit
    exit 0



# SYMLINK: Set current symlink to newest release
  symlink_before: |
    exit 0


  symlink_after: |
    # Rebuild Laravel caches after deployment
    php artisan optimize

    exit 0



# CLEANUP: Cleanup old releases
# Two most recent releases remain available.
  cleanup_before: |
    exit 0


  cleanup_after: |
    exit 0